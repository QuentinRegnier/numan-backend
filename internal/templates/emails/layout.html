<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f7; color: #51545e; margin: 0; padding: 0; }
        .wrapper { width: 100%; table-layout: fixed; background-color: #f4f4f7; padding-bottom: 60px; }
        .main { background-color: #ffffff; margin: 40px auto 0; width: 100%; max-width: 600px; border-spacing: 0; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); }
        .header { background-color: #000000; padding: 30px; text-align: center; }
        .header h1 { color: #ffffff; margin: 0; font-size: 24px; letter-spacing: 4px; font-weight: 600; text-transform: uppercase; }
        .content { padding: 40px; font-size: 16px; line-height: 1.6; color: #333333; }
        .footer { text-align: center; padding: 30px; font-size: 13px; color: #a8aaaf; }
        .btn { display: inline-block; background-color: #000000; color: #ffffff; padding: 14px 28px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 24px; }
    </style>
</head>
<body>
<table class="wrapper">
    <tr>
        <td align="center">
            <table class="main">
                <tr>
                    <td class="header">
                        <h1>NUMAN</h1>
                    </td>
                </tr>
                <tr>
                    <td class="content">
                        {{ template "content" . }}
                    </td>
                </tr>
            </table>
            <table style="width: 100%; max-width: 600px; margin: 0 auto;">
                <tr>
                    <td class="footer">
                        &copy; {{ .Year }} Numan. Tous droits réservés.<br>
                        Cet email a été expédié automatiquement, merci de ne pas y répondre.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
