<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light only">
    <title>Numan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #EFEAE2; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table { border-collapse: separate; }
        a { color: #22252A; }
        /* Bento : largeur "téléphone" fixe, à peine plus large sur ordinateur */
        @media only screen and (min-width: 600px) {
            .shell { max-width: 540px !important; }
        }
        @media only screen and (max-width: 480px) {
            .outer { padding: 16px 10px 28px 10px !important; }
            .box { padding: 32px 22px !important; }
        }
    </style>
</head>
<body style="margin:0;padding:0;background-color:#EFEAE2;font-family:'Poppins','Helvetica Neue',Helvetica,Arial,sans-serif;color:#22252A;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#EFEAE2;">
    <tr>
        <td align="center" class="outer" style="padding:40px 12px 48px 12px;">

            <table role="presentation" class="shell" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:480px;border-collapse:separate;">

                <!-- BOX 1 : contenu -->
                <tr>
                    <td class="box" style="background-color:#FAF7F2;border-radius:28px;padding:40px 32px;">
                        <!-- Icône de l'app : remplace src par l'URL de ton icône (PNG carré, ex. 104x104 pour le retina) -->
                        <img src="" alt="Numan" width="52" height="52" style="display:block;width:52px;height:52px;border:0;outline:none;text-decoration:none;border-radius:15px;margin:0 0 28px 0;background-color:#EFEAE2;">

                        {{ template "content" . }}
                    </td>
                </tr>

                <tr><td height="12" style="height:12px;line-height:12px;font-size:12px;">&nbsp;</td></tr>

                <!-- BOX 2 : logo + obtenir l'application -->
                <tr>
                    <td class="box" style="background-color:#22252A;border-radius:28px;padding:32px 28px;" align="center">
                        <!-- Logo "numan" : remplace src par l'URL de ton logo (version claire, PNG/SVG transparent sur fond sombre #22252A) -->
                        <img src="" alt="numan" width="140" style="display:block;width:140px;max-width:100%;height:auto;border:0;outline:none;text-decoration:none;margin:0 auto 24px auto;">

                        <p style="margin:0 0 14px 0;font-size:12px;line-height:18px;letter-spacing:1.5px;text-transform:uppercase;color:#9A9CA1;font-weight:500;">Obtenir l'application</p>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;">
                            <tr>
                                <td width="33%" style="padding:0 4px;"><a href="https://numan.com/download/ios" style="display:block;border:1px solid #4A4E55;border-radius:12px;padding:11px 0;text-align:center;font-size:13px;line-height:18px;font-weight:500;color:#FAF7F2;text-decoration:none;">iOS</a></td>
                                <td width="33%" style="padding:0 4px;"><a href="https://numan.com/download/android" style="display:block;border:1px solid #4A4E55;border-radius:12px;padding:11px 0;text-align:center;font-size:13px;line-height:18px;font-weight:500;color:#FAF7F2;text-decoration:none;">Android</a></td>
                                <td width="33%" style="padding:0 4px;"><a href="https://numan.com/app" style="display:block;border:1px solid #4A4E55;border-radius:12px;padding:11px 0;text-align:center;font-size:13px;line-height:18px;font-weight:500;color:#FAF7F2;text-decoration:none;">Web</a></td>
                            </tr>
                        </table>

                        <p style="margin:0;font-size:12px;line-height:19px;color:#9A9CA1;">
                            &copy; {{ .Year }} Numan. Tous droits réservés.<br>
                            Cet email a été envoyé automatiquement, merci de ne pas y répondre.
                        </p>
                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>
</body>
</html>
