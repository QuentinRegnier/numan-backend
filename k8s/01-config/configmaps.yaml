# NON-SENSITIVE configuration only. Passwords/tokens/keys live in Secrets (see secret-templates.yaml).
#
# Service names are intentionally kept identical to the legacy Compose hostnames
# (postgres, mongo, redis, watermark) so the legacy variable VALUES keep working
# inside the namespace. The one deliberate change is MINIO_ENDPOINT, which now points
# at the "hot" MinIO (see docs/01-ARCHITECTURE.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: numan-config
  namespace: numan
  labels:
    app.kubernetes.io/name: numan-config
    app.kubernetes.io/part-of: numan
    app.kubernetes.io/component: config
data:
  # --- APPLICATION (source: .env) ---------------------------------------------
  PORT: "8080"
  # Internal Prometheus /metrics scrape port (never exposed via Traefik Ingress).
  METRICS_PORT: "9090"
  # Datacenter identity & deployment profile (used for Redis cluster auto-discovery & CLI topology).
  DATACENTER_ID: "${DC_ID}"
  DATACENTER_INDEX: "${DC_INDEX}"
  DEPLOYMENT_PROFILE: "${CLUSTER_PROFILE}"
  # Default role for API StatefulSet ('monolith' in all-in-one, 'api_node' in distributed/edge-stateless).
  # The websocket StatefulSet overrides this with 'ws_node' and the worker StatefulSet overrides with 'worker_node'.
  SERVER_ROLE: "${API_SERVER_ROLE}"
  # MUST stay "false". With Kubernetes restarts a "true" would wipe the DB on every restart.
  # scripts/validate.sh refuses to proceed if this is not "false".
  CLEAN_DB_ON_STARTUP: "false"
  # 12-Factor logging: write JSON logs exclusively to stdout (required for readOnlyRootFilesystem: true).
  LOG_TO_FILE: "false"
  # WebAuthn / Passkey Relying Party ID (must match the public domain served to clients).
  NUMAN_RP_ID: "${NUMAN_DOMAIN}"
  # WireGuard VPN CIDR trusted by AdminGuard middleware (requires Traefik externalTrafficPolicy: Local).
  WIREGUARD_SUBNET: "${ADMIN_WIREGUARD_SUBNET}"

  # --- WORKER TUNING (source: .env) --------------------------------------------
  WORKER_CONCURRENCY: "${WORKER_POOL_SIZE}"
  WORKER_MAX_BATCH_SIZE: "5000"
  WORKER_MIN_BACKOFF_MS: "50"
  WORKER_MAX_BACKOFF_MS: "1000"

  # --- ACTIVITY-AWARE SCHEDULER THRESHOLDS (consumed by scheduler_node / monolith) --
  NUMAN_SCHEDULER_IDLE_THRESHOLD: "${SCHEDULER_IDLE_THRESHOLD}"
  NUMAN_SCHEDULER_DEEP_IDLE_THRESHOLD: "${SCHEDULER_DEEP_IDLE_THRESHOLD}"
  NUMAN_SCHEDULER_OVERLOAD_THRESHOLD: "${SCHEDULER_OVERLOAD_THRESHOLD}"

  # --- TOPOLOGY (Kubernetes Service names; seamlessly switches standalone <-> HA) --
  POSTGRES_HOST: "${DB_POSTGRES_HOST}"
  POSTGRES_READ_HOST: "${DB_POSTGRES_READ_HOST}"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "numan"
  # Bounded per-pod PostgreSQL pool (prevents exhausting Postgres max_connections under HPA scaling).
  POSTGRES_MAX_OPEN_CONNS: "15"
  POSTGRES_MAX_IDLE_CONNS: "10"
  POSTGRES_CONN_MAX_LIFETIME_SEC: "900"
  POSTGRES_CONN_MAX_IDLE_TIME_SEC: "300"
  POSTGRES_SSLMODE: "${DB_POSTGRES_SSLMODE}"
  MONGO_HOST: "mongo"
  MONGO_PORT: "27017"
  MONGO_HOSTS: "${DB_MONGO_HOSTS}"
  MONGO_REPLICA_SET: "${DB_MONGO_REPLICA_SET}"
  MONGO_READ_PREFERENCE: "${DB_MONGO_READ_PREFERENCE}"
  MONGO_LOCAL_THRESHOLD_MS: "${DB_MONGO_LOCAL_THRESHOLD_MS}"
  MONGO_DB: "numan_mongo"
  # Least-privilege MongoDB app user created by job/mongo-init authenticates against MONGO_DB (not admin).
  MONGO_AUTH_SOURCE: "numan_mongo"
  MONGO_TLS: "${DB_MONGO_TLS}"
  # 3-Tier Universal Redis (Tier 2 & Tier 3 collapse automatically to Tier 1 Core when empty)
  REDIS_ADDR: "redis:6379"
  REDIS_CLUSTER_ADDRS: "${DB_REDIS_CORE_CLUSTER_ADDRS}"
  REDIS_MASTER_NAME: "${DB_REDIS_MASTER_NAME}"
  REDIS_SENTINEL_ADDRS: "${DB_REDIS_SENTINEL_ADDRS}"
  REDIS_TLS: "${DB_REDIS_TLS}"
  REDIS_OBJECT_CLUSTER_ADDRS: "${DB_REDIS_OBJECT_CLUSTER_ADDRS}"
  REDIS_PUBSUB_ADDR: "${DB_REDIS_PUBSUB_ADDRS}"
  # Stable internal name of the hot MinIO S3 endpoint (Service minio-hot, port 9000).
  MINIO_ENDPOINT: "minio-hot:9000"
  # Deployment variable: the same value feeds the bootstrap Job, so app and bucket cannot drift apart.
  MINIO_BUCKET_NAME: "${MINIO_HOT_BUCKET}"
  MINIO_PUBLIC_BUCKET_NAME: "${MINIO_PUBLIC_BUCKET}"
  PUBLIC_MEDIA_BASE_URL: "https://${NUMAN_DOMAIN}/public"
  # Public base URL embedded in HMAC-signed URLs returned to clients (routed by Traefik /process -> watermark:8080).
  WATERMARK_API_URL: "https://${NUMAN_DOMAIN}"

  # --- REDIS SIZING (source: .env; also consumed by the redis StatefulSet) ------
  REDIS_MAXMEMORY: "4gb"
  # Informational for the app (if it reads it). The real container limit is set in
  # 03-databases/redis.yaml (4608Mi). Keep the two consistent.
  REDIS_CONTAINER_LIMIT: "4.5gb"

  # --- SMTP / EMAIL (topologie interne Maddy + expéditeur) ------------------
  SMTP_HOST: "maddy"
  SMTP_PORT: "2525"
  SMTP_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
---
# Settings used ONLY by the MinIO bootstrap Jobs (04-storage/bucket-init-jobs.yaml).
# Not injected into the application.
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-init-config
  namespace: numan
  labels:
    app.kubernetes.io/name: minio-init-config
    app.kubernetes.io/part-of: numan
    app.kubernetes.io/component: config
data:
  HOT_BUCKET: "${MINIO_HOT_BUCKET}"
  PUBLIC_BUCKET: "${MINIO_PUBLIC_BUCKET}"
  COLD_BUCKET: "${MINIO_COLD_BUCKET}"

  # Anonymous read on the hot bucket. The Go application streams media itself with its own S3 credentials
  # (confirmed), so nothing in the cluster needs unauthenticated reads. Default is therefore "false".
  # MIGRATION NOTE: the legacy bootstrap script requested anonymous read (mc policy set download). If any
  # consumer still fetches unsigned object URLs, set the variable to true. The Job applies the value on every run,
  # so "false" also REMOVES a pre-existing anonymous policy from an already existing bucket.
  HOT_ANONYMOUS_READ: "${MINIO_HOT_ANONYMOUS_READ}"
  # The cold bucket is never anonymous.

  # Versioning protects against accidental deletes/overwrites. Reversible (can be suspended).
  HOT_VERSIONING: "${MINIO_HOT_VERSIONING}"
  COLD_VERSIONING: "${MINIO_COLD_VERSIONING}"

  # Object Lock can only be enabled when a bucket is created, and requires versioning. Retention duration/mode is a
  # legal decision (docs/01-ARCHITECTURE.md section 7). Defaults: no lock, no retention, nothing is auto-deleted.
  COLD_OBJECT_LOCK: "${MINIO_COLD_OBJECT_LOCK}"
  # Only honoured when COLD_OBJECT_LOCK is true.
  COLD_DEFAULT_RETENTION_MODE: "${MINIO_COLD_RETENTION_MODE}"
  COLD_DEFAULT_RETENTION_DAYS: "${MINIO_COLD_RETENTION_DAYS}"
