# SECRET TEMPLATES - NOT part of kustomization.yaml and NEVER to be committed with real values.
#
# NOTE: Kubernetes Secrets are only base64-encoded, NOT encrypted. Confidentiality comes from
# (a) K3s secrets-encryption-at-rest, (b) RBAC, (c) keeping real values out of git
# (SOPS/age or Sealed Secrets). See README "Secrets".
#
# Preferred way to create these objects: scripts/create-secrets.sh reads a local, git-ignored
# file (01-config/secrets.env, copy of secrets.env.example) and applies them. This file documents
# the exact object names/keys consumed by the manifests. The "<...>" values are placeholders that
# kubectl would happily accept - do NOT apply this file as-is.
apiVersion: v1
kind: Secret
metadata: {name: postgres-credentials, namespace: numan}
type: Opaque
stringData:
  POSTGRES_USER: "<from secrets.env>"
  POSTGRES_PASSWORD: "<from secrets.env>"
---
apiVersion: v1
kind: Secret
metadata: {name: mongo-credentials, namespace: numan}
type: Opaque
stringData:
  MONGO_ROOT_USER: "<from secrets.env>"
  MONGO_ROOT_PASSWORD: "<from secrets.env>"
---
apiVersion: v1
kind: Secret
metadata: {name: redis-credentials, namespace: numan}
type: Opaque
stringData:
  REDIS_PASSWORD: "<from secrets.env>"
---
# Consumed by api + worker.
apiVersion: v1
kind: Secret
metadata: {name: numan-app-secrets, namespace: numan}
type: Opaque
stringData:
  JWT_SECRET: "<from secrets.env>"
  HMAC_SECRET: "<from secrets.env>"
  WATERMARK_SECRET_KEY: "<from secrets.env>"
---
# Consumed by watermark ONLY (same WATERMARK_SECRET_KEY value as above; separate object so the
# watermark pods never see the JWT/HMAC secrets).
apiVersion: v1
kind: Secret
metadata: {name: numan-watermark-secrets, namespace: numan}
type: Opaque
stringData:
  WATERMARK_SECRET_KEY: "<from secrets.env>"
---
# MinIO "hot": server root credentials (MinIO server + bootstrap Job only).
apiVersion: v1
kind: Secret
metadata: {name: minio-hot-root, namespace: numan}
type: Opaque
stringData:
  MINIO_ROOT_USER: "<from secrets.env>"
  MINIO_ROOT_PASSWORD: "<from secrets.env>"
---
# MinIO "hot": least-privilege users created by the bootstrap Job.
#   S3_ACCESS_KEY/S3_SECRET_KEY         -> application (read/write on the hot bucket only)
#   BACKUP_ACCESS_KEY/BACKUP_SECRET_KEY -> backup CronJob (read-only)
apiVersion: v1
kind: Secret
metadata: {name: minio-hot-users, namespace: numan}
type: Opaque
stringData:
  S3_ACCESS_KEY: "<from secrets.env>"
  S3_SECRET_KEY: "<from secrets.env>"
  BACKUP_ACCESS_KEY: "<from secrets.env>"
  BACKUP_SECRET_KEY: "<from secrets.env>"
---
apiVersion: v1
kind: Secret
metadata: {name: minio-cold-root, namespace: numan}
type: Opaque
stringData:
  MINIO_ROOT_USER: "<from secrets.env>"
  MINIO_ROOT_PASSWORD: "<from secrets.env>"
---
apiVersion: v1
kind: Secret
metadata: {name: minio-cold-users, namespace: numan}
type: Opaque
stringData:
  S3_ACCESS_KEY: "<from secrets.env>"
  S3_SECRET_KEY: "<from secrets.env>"
  BACKUP_ACCESS_KEY: "<from secrets.env>"
  BACKUP_SECRET_KEY: "<from secrets.env>"
---
# Off-site backup target (restic repository + S3 mirror target). Must be OFF the cluster.
apiVersion: v1
kind: Secret
metadata: {name: backup-credentials, namespace: numan}
type: Opaque
stringData:
  RESTIC_REPOSITORY: "<e.g. s3:https://HOST/BUCKET/numan-restic>"
  RESTIC_PASSWORD: "<from secrets.env - ALSO store off-cluster; losing it = losing every backup>"
  AWS_ACCESS_KEY_ID: "<from secrets.env>"
  AWS_SECRET_ACCESS_KEY: "<from secrets.env>"
  BACKUP_S3_ENDPOINT: "<e.g. https://s3.fr-par.scw.cloud>"
  BACKUP_MIRROR_BUCKET: "<bucket for the MinIO mirrors>"
---
# Admin tools (08-operations/admin-tools) - only needed when you enable them.
apiVersion: v1
kind: Secret
metadata: {name: pgadmin-credentials, namespace: numan}
type: Opaque
stringData:
  PGADMIN_DEFAULT_EMAIL: "<from secrets.env>"
  PGADMIN_DEFAULT_PASSWORD: "<from secrets.env>"
---
apiVersion: v1
kind: Secret
metadata: {name: mongo-express-credentials, namespace: numan}
type: Opaque
stringData:
  ME_CONFIG_BASICAUTH_USERNAME: "<from secrets.env>"
  ME_CONFIG_BASICAUTH_PASSWORD: "<from secrets.env>"
---
apiVersion: v1
kind: Secret
metadata: {name: redis-commander-credentials, namespace: numan}
type: Opaque
stringData:
  HTTP_USER: "<from secrets.env>"
  HTTP_PASSWORD: "<from secrets.env>"
