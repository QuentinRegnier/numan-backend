# PostgreSQL - SINGLE INSTANCE. Persistent storage != high availability.
#   * No replication, no automatic failover. A node/disk loss means restore from backup.
#   * With the default local-path StorageClass the volume lives on ONE node's disk.
#   * HA path: CloudNativePG operator (see docs/01-ARCHITECTURE.md) - deliberately not faked here.
# Legacy: postgres:16, env_file .env, data volume, port 5432 (not published in prod).
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: numan
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: numan
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
# Client-facing Service. Name "postgres" == legacy POSTGRES_HOST value.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: numan
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: numan
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: numan
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: numan
    app.kubernetes.io/component: database
spec:
  serviceName: postgres-headless
  replicas: 1                      # DO NOT raise: extra replicas would be independent, empty databases.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:   # never delete data because someone deleted/scaled the StatefulSet
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: numan
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 999               # "postgres" user in the official Debian image
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16.10      # legacy line: postgres:16. Pin the latest 16.x patch at deploy time.
          imagePullPolicy: IfNotPresent
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: numan-config, key: POSTGRES_DB}}
            - name: PGDATA           # sub-directory: avoids "lost+found"/mount-root initdb failures
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:              # allows long crash-recovery / first initdb
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 120
          resources:                 # INITIAL RECOMMENDATION - tune with real load data
            requests: {cpu: "${POSTGRES_CPU_REQUEST}", memory: "${POSTGRES_MEMORY_REQUEST}"}
            limits: {cpu: "${POSTGRES_CPU_LIMIT}", memory: "${POSTGRES_MEMORY_LIMIT}"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: numan
      spec:
        accessModes: [ReadWriteOnce]
        # storageClassName is injected by kustomization.yaml (single place to change it).
        resources:
          requests:
            storage: "${PVC_SIZE_POSTGRES}"            # size: see infrastructure.env.template (immutable once created)
