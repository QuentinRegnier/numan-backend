# MongoDB 7 - Native StatefulSet Replica Set (rs0) with keyFile authentication.
#   * Plastic scaling (1 -> 2 -> 3+ odd):
#       - replicas=1 (default): single-node Replica Set rs0 on Mac / small VPS.
#         Running with --replSet rs0 even at 1 replica enables hot-adding mongo-1 and mongo-2
#         online with ZERO downtime or restart of mongo-0!
#       - replicas=2: dev/test Primary + Secondary (tests readPreference & manual failover locally).
#       - replicas=3+ (odd): full production HA with automatic Raft Primary election.
#   * Hardware plasticity:
#       - podAntiAffinity is SOFT (preferred): spreads pods across physical servers when available,
#         OR co-locates 3 replicas on 1 physical server with 3 separate NVMe SSDs via WaitForFirstConsumer
#         local PVs (STORAGE_CLASS_MONGODB=nvme-mongo; see 04-storage/nvme-local-pv.example.yaml).
#   * Bootstrap / scaling: job/mongo-init (03-databases/mongo-init-job.yaml) idempotently initializes rs0,
#     registers members 0..(N-1) with configurable priority, and provisions least-privilege MONGO_APP_USER.
apiVersion: v1
kind: Service
metadata:
  name: mongo-headless
  namespace: numan
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: numan
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mongo
  ports:
    - {name: mongo, port: 27017, targetPort: mongo}
---
# Client-facing ClusterIP Service (fallback for single-node clients & bootstrap).
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: numan
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: numan
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mongo
  ports:
    - {name: mongo, port: 27017, targetPort: mongo}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongo
  namespace: numan
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: numan
    app.kubernetes.io/component: database
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: numan
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: numan
    app.kubernetes.io/component: database
spec:
  serviceName: mongo-headless
  replicas: ${DB_MONGO_REPLICAS}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo
        app.kubernetes.io/part-of: numan
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: mongo
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 999               # "mongodb" user in the official image
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: numan.io/node-profile
                    operator: In
                    values: ["db-mongo"]
            - weight: 80
              preference:
                matchExpressions:
                  - key: numan.io/node-profile
                    operator: In
                    values: ["db"]
            - weight: 50
              preference:
                matchExpressions:
                  - key: numan.io/node-profile
                    operator: In
                    values: ["all-in-one"]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: mongo
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: numan.io/dedicated
          operator: Equal
          value: db-mongo
          effect: NoSchedule
        - key: numan.io/dedicated
          operator: Equal
          value: db
          effect: NoSchedule
      initContainers:
        # mongod strictly requires keyFile permissions <= 0600 owned by UID 999 (Secret mounts may be 0444/group-readable).
        - name: prepare-keyfile
          image: mongo:7.0.14
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cp /etc/mongo-keyfile-src/keyfile /etc/mongo-keyfile/keyfile
              chmod 0400 /etc/mongo-keyfile/keyfile
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: keyfile-src, mountPath: /etc/mongo-keyfile-src, readOnly: true}
            - {name: keyfile, mountPath: /etc/mongo-keyfile}
      containers:
        - name: mongo
          image: mongo:7.0.14        # legacy line: mongo:7. Pin the latest 7.0.x patch at deploy time.
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -n "$MONGO_REPLICA_SET" ]; then
                exec docker-entrypoint.sh mongod \
                  --replSet "$MONGO_REPLICA_SET" \
                  --keyFile /etc/mongo-keyfile/keyfile \
                  --bind_ip_all
              else
                exec docker-entrypoint.sh mongod --bind_ip_all
              fi
          ports:
            - {name: mongo, containerPort: 27017}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: {secretKeyRef: {name: mongo-credentials, key: MONGO_ROOT_USER}}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: mongo-credentials, key: MONGO_ROOT_PASSWORD}}
            - name: MONGO_REPLICA_SET
              valueFrom: {configMapKeyRef: {name: numan-config, key: MONGO_REPLICA_SET}}
          # TCP probes on purpose: during first-run init the image starts a temporary mongod bound to
          # localhost only, so the pod IP port only opens for the real, authenticated server. (An exec
          # probe with mongosh would spawn a heavy Node process every few seconds.)
          readinessProbe:
            tcpSocket: {port: mongo}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: mongo}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            tcpSocket: {port: mongo}
            periodSeconds: 5
            failureThreshold: 120
          resources:                 # INITIAL RECOMMENDATION
            requests: {cpu: "${MONGODB_CPU_REQUEST}", memory: "${MONGODB_MEMORY_REQUEST}"}
            limits: {cpu: "${MONGODB_CPU_LIMIT}", memory: "${MONGODB_MEMORY_LIMIT}"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: configdb, mountPath: /data/configdb}
            - {name: keyfile, mountPath: /etc/mongo-keyfile, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: configdb, emptyDir: {}}
        - {name: keyfile, emptyDir: {sizeLimit: 1Mi}}
        - name: keyfile-src
          secret:
            secretName: mongo-keyfile
            defaultMode: 256
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: mongo
          app.kubernetes.io/part-of: numan
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: "${STORAGE_CLASS_MONGODB}"
        resources:
          requests:
            storage: "${PVC_SIZE_MONGODB}"            # size: see infrastructure.env.template (immutable once created)
