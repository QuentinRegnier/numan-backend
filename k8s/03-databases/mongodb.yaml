# MongoDB - SINGLE STANDALONE INSTANCE (this is NOT a replica set).
#   * No replication/failover. No multi-document transactions or change streams (they need a replica
#     set); the legacy stack was also standalone, so nothing regresses - but verify the Go code does
#     not depend on them.
#   * A real replica set needs rs.initiate(), a keyFile, stable per-member DNS and >=3 voting members;
#     it is intentionally not faked with N standalone replicas. See docs/01-ARCHITECTURE.md.
# Legacy: mongo:7, MONGO_INITDB_ROOT_USERNAME/PASSWORD <- MONGO_ROOT_USER/PASSWORD, port 27017.
# NOTE: the legacy docker-compose.infra.yml mongo used env_file only, so those INITDB variables were
# never set there => it ran WITHOUT authentication. Do not copy that file's behaviour.
apiVersion: v1
kind: Service
metadata:
  name: mongo-headless
  namespace: numan
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: numan
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mongo
  ports:
    - {name: mongo, port: 27017, targetPort: mongo}
---
# Name "mongo" == legacy MONGO_HOST value.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: numan
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: numan
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mongo
  ports:
    - {name: mongo, port: 27017, targetPort: mongo}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: numan
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: numan
    app.kubernetes.io/component: database
spec:
  serviceName: mongo-headless
  replicas: 1                      # DO NOT raise (would create independent empty databases).
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo
        app.kubernetes.io/part-of: numan
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: mongo
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 999               # "mongodb" user in the official image
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mongo
          image: mongo:7.0.14        # legacy line: mongo:7. Pin the latest 7.0.x patch at deploy time.
          imagePullPolicy: IfNotPresent
          ports:
            - {name: mongo, containerPort: 27017}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: {secretKeyRef: {name: mongo-credentials, key: MONGO_ROOT_USER}}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: mongo-credentials, key: MONGO_ROOT_PASSWORD}}
          # TCP probes on purpose: during first-run init the image starts a temporary mongod bound to
          # localhost only, so the pod IP port only opens for the real, authenticated server. (An exec
          # probe with mongosh would spawn a heavy Node process every few seconds.)
          readinessProbe:
            tcpSocket: {port: mongo}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: mongo}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            tcpSocket: {port: mongo}
            periodSeconds: 5
            failureThreshold: 120
          resources:                 # INITIAL RECOMMENDATION
            requests: {cpu: "${MONGODB_CPU_REQUEST}", memory: "${MONGODB_MEMORY_REQUEST}"}
            limits: {cpu: "${MONGODB_CPU_LIMIT}", memory: "${MONGODB_MEMORY_LIMIT}"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: configdb, mountPath: /data/configdb}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: configdb, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: mongo
          app.kubernetes.io/part-of: numan
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: "${PVC_SIZE_MONGODB}"            # size: see infrastructure.env.template (immutable once created)
