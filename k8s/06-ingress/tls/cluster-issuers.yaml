# REQUIRES cert-manager (external operator). Install it FIRST (README step "TLS") - these kinds do not exist otherwise:
#     helm repo add jetstack https://charts.jetstack.io
#     helm install cert-manager jetstack/cert-manager -n cert-manager --create-namespace \
#       --version <PINNED_VERSION> --set crds.enabled=true
# Pin a cert-manager version that supports your Kubernetes version (check the cert-manager supported-releases page).
#
# ACME_EMAIL (deployment variable) must be a monitored mailbox for ACME expiry/registration notices.
# Use letsencrypt-staging first: production has strict rate limits.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: "${ACME_EMAIL}"
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "${ACME_EMAIL}"
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
