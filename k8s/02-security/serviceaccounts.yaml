# One ServiceAccount per workload class. None of these workloads talks to the Kubernetes API,
# so no Role/RoleBinding exists for them and token automount is disabled.
# If you use a PRIVATE registry, create a dockerconfigjson Secret named "registry-credentials" and
# uncomment imagePullSecrets on api, worker and watermark (see README "Images").
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: numan
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: numan
automountServiceAccountToken: false
# imagePullSecrets:
#   - name: registry-credentials
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: numan
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: numan
automountServiceAccountToken: false
# imagePullSecrets:
#   - name: registry-credentials
