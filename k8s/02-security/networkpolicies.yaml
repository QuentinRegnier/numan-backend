# NetworkPolicies - default deny, then explicit allows.
#
# DEPENDENCY: the CNI must ENFORCE NetworkPolicy. K3s's default (Flannel + the embedded kube-router
# network-policy controller) does, unless K3s was started with --disable-network-policy or with a
# different CNI. Verify BEFORE relying on this file (README, "Prerequisites"):
#     k3s check-config 2>/dev/null | grep -i netpol ; kubectl -n kube-system get pods
# and prove it with scripts/verify.sh (negative test: an unlabeled pod must NOT reach postgres).
#
# Pod access labels used below (set on pod templates):
#   numan.io/uses-postgres | uses-mongo | uses-redis | uses-minio-hot | uses-minio-cold  -> may reach that datastore
#   numan.io/egress-internet                                                              -> may reach the Internet on TCP/443
#   numan.io/exposed-via-traefik                                                           -> may receive traffic from Traefik
#
# NOT covered (add if you need them): scraping by a monitoring stack (needs an ingress rule from its
# namespace), IPv6 egress, outbound ports other than 443 for api/worker (e.g. SMTP) - the legacy
# files do not reveal external dependencies; check the app logs and extend allow-egress-internet-https.
# kubelet health probes originate from the node and are allowed by the K3s policy controller; verify.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: numan
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: numan
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# Traefik (kube-system, bundled with K3s) -> workloads that the Ingress routes to.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: numan
spec:
  podSelector:
    matchLabels:
      numan.io/exposed-via-traefik: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - {protocol: TCP, port: 8080}
---
