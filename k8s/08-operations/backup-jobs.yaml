apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-minio-hot
  namespace: numan
  labels:
    app.kubernetes.io/name: backup-minio-hot
    app.kubernetes.io/part-of: numan
    app.kubernetes.io/component: backup
spec:
  schedule: "${BACKUP_SCHEDULE_MINIO_HOT}"
  timeZone: "${SYSTEM_TIMEZONE}"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup-minio-hot
            app.kubernetes.io/part-of: numan
            app.kubernetes.io/component: backup
            numan.io/egress-internet: "true"
            numan.io/uses-minio-hot: "true"
        spec:
          serviceAccountName: backup
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              image: ${MINIO_MC_IMAGE}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  export MC_CONFIG_DIR=/tmp/.mc
                  mc alias set src http://minio-hot:9000 "$BACKUP_ACCESS_KEY" "$BACKUP_SECRET_KEY" >/dev/null
                  mc alias set offsite "$BACKUP_S3_ENDPOINT" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" >/dev/null
                  BUCKET="$MINIO_BUCKET"
                  # No --remove on purpose: a deletion on the source must never silently delete the off-site copy.
                  mc mirror --preserve --overwrite "src/$BUCKET" "offsite/$BACKUP_MIRROR_BUCKET/minio-hot/$BUCKET"
                  echo "minio-hot mirror OK"
              env:
                - name: BACKUP_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: minio-hot-users, key: BACKUP_ACCESS_KEY}}
                - name: BACKUP_SECRET_KEY
                  valueFrom: {secretKeyRef: {name: minio-hot-users, key: BACKUP_SECRET_KEY}}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: backup-credentials, key: AWS_ACCESS_KEY_ID}}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: backup-credentials, key: AWS_SECRET_ACCESS_KEY}}
                - name: BACKUP_S3_ENDPOINT
                  valueFrom: {secretKeyRef: {name: backup-credentials, key: BACKUP_S3_ENDPOINT}}
                - name: BACKUP_MIRROR_BUCKET
                  valueFrom: {secretKeyRef: {name: backup-credentials, key: BACKUP_MIRROR_BUCKET}}
                - name: MINIO_BUCKET
                  valueFrom: {configMapKeyRef: {name: minio-init-config, key: HOT_BUCKET}}
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: "${BACKUP_CPU_LIMIT}", memory: "${BACKUP_MEMORY_LIMIT}"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: tmp, emptyDir: {}}
---
