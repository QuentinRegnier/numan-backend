# Backup CronJobs. A PVC is NOT a backup, and a backup on the same node is not a backup either:
# every job pushes to an OFF-CLUSTER S3-compatible target defined in Secret "backup-credentials".
#
#   Postgres / Mongo / Redis : logical dump (init container) -> restic (client-side encrypted, deduplicated,
#                              retention via `restic forget --prune`) -> off-site repository.
#   MinIO hot / cold         : `mc mirror` (no --remove: deletions are NOT propagated) -> off-site bucket.
#                              Enable VERSIONING + (ideally) Object Lock on the off-site bucket; a compromised
#                              cluster that can delete backups is not a backup.
#
# PROVISIONAL targets (confirm with the business): RPO 24h, RTO 4h for databases; MinIO RPO 24h.
# WAL archiving / PITR would lower the Postgres RPO - that is what CloudNativePG + barman would add.
# Schedules, time zone (CronJob timeZone, GA since Kubernetes 1.27), retention and sizing are deployment variables
# (infrastructure.env.template).
# NOTHING here is useful until restores have been TESTED: see docs/03-OPERATIONS.md "Restore drills".
# No Job relies on `$(...)` command substitution: Kubernetes would try to expand it inside args.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres
  namespace: numan
  labels:
    app.kubernetes.io/name: backup-postgres
    app.kubernetes.io/part-of: numan
    app.kubernetes.io/component: backup
spec:
  schedule: "${BACKUP_SCHEDULE_POSTGRES}"
  timeZone: "${SYSTEM_TIMEZONE}"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup-postgres
            app.kubernetes.io/part-of: numan
            app.kubernetes.io/component: backup
            numan.io/egress-internet: "true"
            numan.io/uses-postgres: "true"
        spec:
          serviceAccountName: backup
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: dump
              image: postgres:16.10
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  pg_dump -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f /backup/numan.dump
                  pg_dumpall -h postgres -U "$POSTGRES_USER" --globals-only -f /backup/globals.sql
                  ls -l /backup
              env:
                - name: POSTGRES_USER
                  valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}}
                - name: POSTGRES_PASSWORD
                  valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}
                - name: POSTGRES_DB
                  valueFrom: {configMapKeyRef: {name: numan-config, key: POSTGRES_DB}}
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: "2", memory: 1Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: backup
              image: restic/restic:0.18.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  restic cat config >/dev/null 2>&1 || restic init
                  restic backup /backup --tag postgres --host ${ENVIRONMENT_NAME}-postgres
                  restic forget --tag postgres --host ${ENVIRONMENT_NAME}-postgres --keep-daily ${BACKUP_RETENTION_DAILY} --keep-weekly ${BACKUP_RETENTION_WEEKLY} --keep-monthly ${BACKUP_RETENTION_MONTHLY} --prune
                  restic check
                  echo "postgres backup OK"
              env:
                - name: RESTIC_REPOSITORY
                  valueFrom: {secretKeyRef: {name: backup-credentials, key: RESTIC_REPOSITORY}}
                - name: RESTIC_PASSWORD
                  valueFrom: {secretKeyRef: {name: backup-credentials, key: RESTIC_PASSWORD}}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: backup-credentials, key: AWS_ACCESS_KEY_ID}}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: backup-credentials, key: AWS_SECRET_ACCESS_KEY}}
                - {name: RESTIC_CACHE_DIR, value: /tmp/restic-cache}
                - {name: TMPDIR, value: /tmp}
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: "${BACKUP_CPU_LIMIT}", memory: "${BACKUP_MEMORY_LIMIT}"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                - {name: backup, mountPath: /backup}
          volumes:
            - {name: backup, emptyDir: {sizeLimit: "${BACKUP_SCRATCH_SIZE}"}}
            - {name: tmp, emptyDir: {}}
---
apiVersion: batch/v1
