# OPTIONAL administrative web UIs: pgAdmin, mongo-express, Redis Commander.
# Safe-by-default dual-access design:
#   * replicas: 0  -> nothing runs until an operator enables a tool (`scripts/admin.sh on <tool>`).
#   * Option A (Default, zero Ingress): `ClusterIP` Services + `scripts/admin.sh forward <tool>`
#     (kubectl port-forward bound to 127.0.0.1).
#   * Option B (Optional WireGuard browser UI): deploy `make deploy-admin-ingress` (requires Traefik
#     with `externalTrafficPolicy: Local` -> `make deploy-traefik` + Traefik `wireguard-only` ipAllowList).
#   * HA-aware out of the box:
#       - pgAdmin mounts pre-configured servers.json with Primary (${DB_POSTGRES_HOST}) + Read Replicas (postgres-ro).
#       - mongo-express connects to MongoDB Replica Set (MONGO_HOSTS / MONGO_REPLICA_SET, readPreference=secondaryPreferred)
#         when HA is enabled, falling back cleanly to standalone `mongo:27017`.
#       - redis-commander connects via Redis Sentinel (REDIS_SENTINELS / REDIS_SENTINEL_NAME) when HA is enabled,
#         falling back cleanly to standalone `redis:6379`.
#   * Disable again when done: `scripts/admin.sh off all`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  namespace: numan
  labels:
    app.kubernetes.io/name: pgadmin
    app.kubernetes.io/part-of: numan
    app.kubernetes.io/component: admin
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "Numan PostgreSQL Primary (${DB_POSTGRES_HOST})",
          "Group": "Numan Cluster",
          "Host": "${DB_POSTGRES_HOST}",
          "Port": 5432,
          "MaintenanceDB": "numan",
          "Username": "numan",
          "SSLMode": "${DB_POSTGRES_SSLMODE}"
        },
        "2": {
          "Name": "Numan PostgreSQL Read Replicas (postgres-ro)",
          "Group": "Numan Cluster",
          "Host": "postgres-ro",
          "Port": 5432,
          "MaintenanceDB": "numan",
          "Username": "numan",
          "SSLMode": "${DB_POSTGRES_SSLMODE}"
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: numan
  labels: {app.kubernetes.io/name: pgadmin, app.kubernetes.io/part-of: numan, app.kubernetes.io/component: admin}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: pgadmin}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: numan
  labels: {app.kubernetes.io/name: pgadmin, app.kubernetes.io/part-of: numan, app.kubernetes.io/component: admin}
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: pgadmin}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgadmin
        app.kubernetes.io/part-of: numan
        app.kubernetes.io/component: admin
        numan.io/uses-postgres: "true"
        numan.io/admin-wireguard-ingress: "true"
    spec:
      serviceAccountName: admin-tools
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 5050            # "pgadmin" user of dpage/pgadmin4
        runAsGroup: 5050
        fsGroup: 5050
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9.0
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: PGADMIN_LISTEN_PORT      # unprivileged port (capabilities are dropped, so :80 is not bindable)
              value: "8080"
            - name: PGADMIN_SERVER_JSON_FILE
              value: "/pgadmin4/servers.json"
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom: {secretKeyRef: {name: pgadmin-credentials, key: PGADMIN_DEFAULT_EMAIL}}
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom: {secretKeyRef: {name: pgadmin-credentials, key: PGADMIN_DEFAULT_PASSWORD}}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}     # root FS is writable: pgAdmin writes in several places
          volumeMounts:
            - {name: data, mountPath: /var/lib/pgadmin}
            - {name: servers, mountPath: /pgadmin4/servers.json, subPath: servers.json, readOnly: true}
      volumes:
        - {name: data, emptyDir: {}}
        - name: servers
          configMap:
            name: pgadmin-servers
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
  namespace: numan
  labels: {app.kubernetes.io/name: mongo-express, app.kubernetes.io/part-of: numan, app.kubernetes.io/component: admin}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: mongo-express}
  ports:
    - {name: http, port: 8081, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: numan
  labels: {app.kubernetes.io/name: mongo-express, app.kubernetes.io/part-of: numan, app.kubernetes.io/component: admin}
spec:
  replicas: 0
  selector:
    matchLabels: {app.kubernetes.io/name: mongo-express}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo-express
        app.kubernetes.io/part-of: numan
        app.kubernetes.io/component: admin
        numan.io/uses-mongo: "true"
        numan.io/admin-wireguard-ingress: "true"
    spec:
      serviceAccountName: admin-tools
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mongo-express
          image: mongo-express:1.0.2-20     # legacy used :latest (unpinned)
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -n "$MONGO_HOSTS" ] && [ -n "$MONGO_REPLICA_SET" ]; then
                export ME_CONFIG_MONGODB_URL="mongodb://$ME_CONFIG_MONGODB_ADMINUSERNAME:$ME_CONFIG_MONGODB_ADMINPASSWORD@$MONGO_HOSTS/admin?replicaSet=$MONGO_REPLICA_SET&readPreference=secondaryPreferred"
                unset ME_CONFIG_MONGODB_SERVER
              fi
              exec /sbin/tini -- /docker-entrypoint.sh mongo-express
          ports:
            - {name: http, containerPort: 8081}
          env:
            - name: ME_CONFIG_MONGODB_SERVER
              value: mongo
            - name: MONGO_HOSTS
              valueFrom: {configMapKeyRef: {name: numan-config, key: MONGO_HOSTS}}
            - name: MONGO_REPLICA_SET
              valueFrom: {configMapKeyRef: {name: numan-config, key: MONGO_REPLICA_SET}}
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom: {secretKeyRef: {name: mongo-credentials, key: MONGO_ROOT_USER}}
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom: {secretKeyRef: {name: mongo-credentials, key: MONGO_ROOT_PASSWORD}}
            - name: ME_CONFIG_BASICAUTH_USERNAME
              valueFrom: {secretKeyRef: {name: mongo-express-credentials, key: ME_CONFIG_BASICAUTH_USERNAME}}
            - name: ME_CONFIG_BASICAUTH_PASSWORD
              valueFrom: {secretKeyRef: {name: mongo-express-credentials, key: ME_CONFIG_BASICAUTH_PASSWORD}}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-commander
  namespace: numan
  labels: {app.kubernetes.io/name: redis-commander, app.kubernetes.io/part-of: numan, app.kubernetes.io/component: admin}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: redis-commander}
  ports:
    - {name: http, port: 8081, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-commander
  namespace: numan
  labels: {app.kubernetes.io/name: redis-commander, app.kubernetes.io/part-of: numan, app.kubernetes.io/component: admin}
spec:
  replicas: 0
  selector:
    matchLabels: {app.kubernetes.io/name: redis-commander}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-commander
        app.kubernetes.io/part-of: numan
        app.kubernetes.io/component: admin
        numan.io/uses-redis: "true"
        numan.io/admin-wireguard-ingress: "true"
    spec:
      serviceAccountName: admin-tools
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis-commander
          image: ghcr.io/joeferner/redis-commander:0.9.0     # legacy used :latest (unpinned)
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -n "$REDIS_SENTINEL_ADDRS" ]; then
                export REDIS_SENTINELS="$REDIS_SENTINEL_ADDRS"
                export REDIS_SENTINEL_NAME="$REDIS_MASTER_NAME"
                unset REDIS_HOST
                unset REDIS_PORT
              fi
              exec /redis-commander/docker/entrypoint.sh
          ports:
            - {name: http, containerPort: 8081}
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_MASTER_NAME
              valueFrom: {configMapKeyRef: {name: numan-config, key: REDIS_MASTER_NAME}}
            - name: REDIS_SENTINEL_ADDRS
              valueFrom: {configMapKeyRef: {name: numan-config, key: REDIS_SENTINEL_ADDRS}}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis-credentials, key: REDIS_PASSWORD}}
            - name: HTTP_USER
              valueFrom: {secretKeyRef: {name: redis-commander-credentials, key: HTTP_USER}}
            - name: HTTP_PASSWORD
              valueFrom: {secretKeyRef: {name: redis-commander-credentials, key: HTTP_PASSWORD}}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
